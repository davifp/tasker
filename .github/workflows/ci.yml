name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job A: lint, typecheck, test (with coverage), build ──────────────────────
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrate the shared postgres service so integration specs that reuse
      # it (ai-controller, ai-budget-notification) find the User/Workspace
      # tables at import time. Specs that stand up their own Testcontainers
      # postgres call migrate themselves inside beforeAll.
      - name: Run Prisma migrations (shared postgres)
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgres://tasker:tasker@localhost:5432/tasker

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build
        env:
          DATABASE_URL: postgres://tasker:tasker@localhost:5432/tasker
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Generate coverage report
        run: pnpm turbo run test:cov
        env:
          DATABASE_URL: postgres://tasker:tasker@localhost:5432/tasker
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Check coverage thresholds
        run: node scripts/check-coverage.mjs

      - name: Audit dependencies (advisory)
        run: pnpm audit --audit-level=high || true

  # ── Job B: Playwright E2E (Chromium) ─────────────────────────────────────────
  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Build workspace packages consumed by dev servers
        run: pnpm --filter @tasker/config build

      - name: Run Prisma migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgres://tasker:tasker@localhost:5432/tasker

      - name: Run Playwright specs
        run: pnpm test:e2e
        env:
          CI: 'true'
          DATABASE_URL: postgres://tasker:tasker@localhost:5432/tasker
          REDIS_URL: redis://localhost:6379
          MAILHOG_URL: http://localhost:8025
          SMTP_HOST: localhost
          SMTP_PORT: '1025'
          NODE_ENV: test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
