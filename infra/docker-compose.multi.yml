# Two-node scale-out profile for Socket.IO Redis adapter validation.
#
# Boots two `api` replicas (`api-a`, `api-b`) sharing the same Postgres +
# Redis. Both bind to distinct host ports so an integration test can open a
# socket to node A and emit through node B's HTTP API, then assert the event
# lands on the client connected to node A. That is the smallest observable
# proof that `@socket.io/redis-adapter` is wired end-to-end.
#
# Usage:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.multi.yml up
#
# The base file provides postgres/redis/mailhog/minio; this file adds the two
# API nodes. Web is left off — the integration test drives HTTP + WS
# directly.

services:
  api-a:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: tasker_api_a
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: api-a
      PORT: '3001'
      DATABASE_URL: postgres://${POSTGRES_USER:-tasker}:${POSTGRES_PASSWORD:-tasker}@postgres:5432/${POSTGRES_DB:-tasker}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-multi-node-test-secret-please-change}
      NOTIF_EMAIL_BATCH_WINDOW_S: '60'
    ports:
      - '${API_A_PORT:-3011}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  api-b:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: tasker_api_b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: api-b
      PORT: '3001'
      DATABASE_URL: postgres://${POSTGRES_USER:-tasker}:${POSTGRES_PASSWORD:-tasker}@postgres:5432/${POSTGRES_DB:-tasker}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-multi-node-test-secret-please-change}
      NOTIF_EMAIL_BATCH_WINDOW_S: '60'
    ports:
      - '${API_B_PORT:-3012}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
