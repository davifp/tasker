apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    editable: false
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      # Enables click-through from a Prometheus range series to the trace
      # backing it — Tempo datasource must be provisioned (it is, by
      # tempo.yml in the same folder).
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
