apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      search:
        hide: false
      nodeGraph:
        enabled: true
      # tracesToLogsV2 / tracesToMetrics / serviceMap intentionally omitted:
      # they reference Loki/Prometheus datasources that Task 3.0 (Prometheus)
      # and a future logs pipeline will add. Grafana surfaces broken links
      # when the referenced UIDs don't exist, so we wire them in only when
      # the target datasources land.
