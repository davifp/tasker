apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      search:
        hide: false
      nodeGraph:
        enabled: true
      # tracesToMetrics + serviceMap wire the Tempo↔Prometheus click-through
      # now that Task 3.0 has provisioned the `prometheus` datasource.
      # tracesToLogsV2 stays absent until a Loki (or equivalent) sink is added.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
      serviceMap:
        datasourceUid: prometheus
