# Nginx reverse proxy for the single-node Ampere A1 deploy.
#
# Responsibilities:
#   1. TLS termination (Let's Encrypt certificate mounted at
#      /etc/letsencrypt/live/${LE_DOMAIN}/; certbot container renews it).
#   2. HTTP → HTTPS redirect + ACME HTTP-01 challenge passthrough.
#   3. Public rate limiting (10 r/s per IP, burst 20) with `/monitoring`
#      (Sentry tunnel from Task 4.0) exempted so error events never get
#      dropped by the edge.
#   4. Static-asset cache: `/_next/static/*` gets `expires 1y, immutable`.
#   5. Upstreams: `web` (:3000) for HTML/RSC, `api` (:3001) for /api/*
#      and Socket.IO. `/openapi.json` proxied to the API's spec dump.
#
# Server name is templated via envsubst at container start — see the
# entrypoint script comment below.

user  nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ── Base MIME + logging + tuning ────────────────────────────────────────
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Pino-style single-line access log. `$request_time` is the wall-clock
  # spent on the request; `$upstream_response_time` isolates upstream cost.
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_ms":$request_time,'
    '"upstream_ms":"$upstream_response_time","referer":"$http_referer",'
    '"ua":"$http_user_agent","x_forwarded_for":"$http_x_forwarded_for"}';
  access_log /var/log/nginx/access.log json;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  server_tokens off;
  # Upload cap — matches the presigned attachment TTL policy; anything larger
  # goes through the S3 multipart path, not through the proxy.
  client_max_body_size 25M;

  # ── gzip ────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/xml
    application/rss+xml application/atom+xml image/svg+xml
    font/woff font/woff2;

  # ── Per-IP rate limit ──────────────────────────────────────────────────
  # 10 requests/second sustained, burst 20 (nodelay) — techspec §Security §6.
  # `binary_remote_addr` uses the raw IP so proxied clients cannot bypass
  # by rotating X-Forwarded-For. `zone=public:10m` fits ~160k unique IPs.
  limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;

  # ── Upstream pools ─────────────────────────────────────────────────────
  upstream tasker_api {
    server api:3001 max_fails=3 fail_timeout=15s;
    keepalive 16;
  }
  upstream tasker_web {
    server web:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  # ── :80 — HTTP → HTTPS + ACME challenge ────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenge. Served plaintext because that is the
    # protocol's requirement — the challenge files are ephemeral.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── :443 — TLS termination + reverse proxy ─────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Cert paths are populated by certbot on first successful issuance. The
    # container fails to boot until the files exist — see the deploy runbook
    # in docs/adr/0001-oracle-always-free.md for the bootstrap sequence.
    ssl_certificate     /etc/letsencrypt/live/tasker/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasker/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # HSTS mirrors the app-layer header (Task 6). 2y preload-safe.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # ── Static assets: long cache, no revalidation ───────────────────────
    location /_next/static/ {
      proxy_pass http://tasker_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ── Sentry tunnel — bypass the aggressive rate limit ────────────────
    # `withSentryConfig({ tunnelRoute: '/monitoring' })` funnels client-side
    # error events through same-origin. Rate-limiting it drops errors during
    # incidents — the very moment observability matters most.
    location /monitoring {
      proxy_pass http://tasker_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # ── API + WebSocket ─────────────────────────────────────────────────
    location /api/ {
      limit_req zone=public burst=20 nodelay;
      proxy_pass http://tasker_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Socket.IO long-poll fallback needs longer read timeouts than the
      # default 60s — leave headroom without exposing a hang vector.
      proxy_read_timeout 90s;
    }

    # ── OpenAPI spec (public) ────────────────────────────────────────────
    location = /openapi.json {
      proxy_pass http://tasker_api/api/v1/openapi.json;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    # ── App shell — HTML/RSC ─────────────────────────────────────────────
    location / {
      limit_req zone=public burst=20 nodelay;
      proxy_pass http://tasker_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }
  }
}
