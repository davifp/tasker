services:
  postgres:
    image: postgres:16.4-alpine
    container_name: tasker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasker}
      POSTGRES_DB: ${POSTGRES_DB:-tasker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - tasker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tasker} -d ${POSTGRES_DB:-tasker}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: tasker_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - tasker_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: tasker_mailhog
    restart: unless-stopped
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/api/v2/messages']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # S3-compatible object storage for local dev + Playwright. Production
    # points at AWS S3 or Cloudflare R2 via the same STORAGE_* env — see
    # techspec § Integration points › Object storage.
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: tasker_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - tasker_minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    # One-shot bucket provisioner: waits for MinIO to be healthy, then creates
    # the attachments bucket if it does not exist. Idempotent — safe to run
    # on every `docker-compose up`.
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: tasker_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-tasker-attachments}
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$STORAGE_BUCKET\" &&
      mc anonymous set none local/\"$$STORAGE_BUCKET\" &&
      echo 'MinIO bucket ready';
      "
    restart: 'no'

volumes:
  tasker_pg_data:
  tasker_redis_data:
  tasker_minio_data:
