# Scrape config for the self-hosted Prometheus that fronts the Ampere A1 box.
# Consumed by the `prometheus` service in `infra/docker-compose.prod.yml`; the
# container mounts this file at `/etc/prometheus/prometheus.yml`.
#
# Retention: 15 days, capped at 2 GB — set via CLI flags on the container
# (see docker-compose.prod.yml command block). 15 d fits inside the 200 GB
# Always Free disk with room for Tempo blocks (7 d) and Postgres data.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tasker-prod
    replica: '01'

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: tasker-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3001']
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: tempo

  # Pushgateway carries metrics from cron-driven jobs (backup sidecar).
  # `honor_labels: true` preserves the `env` / `job` labels the pusher
  # attaches; without it Prometheus would overwrite `job` with
  # `pushgateway`, and the "backup missing" alert would lose its per-env
  # dimension.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: pushgateway
