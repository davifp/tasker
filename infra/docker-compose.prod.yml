# Production compose scaffold. Task 2.0 lands the observability services
# (Tempo + Grafana bootstrap); Tasks 3.0 (Prometheus), 7.0 (API/Worker/Web/
# Nginx/Certbot), and 9.0 (backup sidecar) extend this file with their own
# services and volumes.
#
# Deployed as `docker compose -f infra/docker-compose.prod.yml up -d`.

services:
  tempo:
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo/tempo.yml']
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      # OTLP intake — API/worker/web export here from inside the compose
      # network as http://tempo:4318. Not published on the host.
      - '127.0.0.1:4318:4318'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3200/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700M

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      tempo:
        condition: service_healthy
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports:
      # Nginx (Task 7.0) will front this on the public domain; for now expose
      # locally only.
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  tempo_data:
  grafana_data:
