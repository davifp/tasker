title = "Tasker gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
id = "local-dev-credentials"
description = "Known-safe local development strings — not real secrets"
regexes = [
  '''tasker:tasker@localhost''',
  '''postgres://tasker:tasker@localhost''',
  '''redis://localhost''',
  '''localhost:5432''',
  '''localhost:6379''',
  '''localhost:1025''',
  '''localhost:8025''',
]

[[allowlists]]
id = "test-fixtures"
description = "Mock values used in tests — not real secrets"
paths = [
  '''.*\.test\.(ts|tsx|js)$''',
  '''.*\.spec\.(ts|tsx|js)$''',
  '''.*__fixtures__.*''',
]
